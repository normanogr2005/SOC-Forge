[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-forge"
version = "0.2.0"
description = "Mini SOC for security log analysis and detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.54,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
